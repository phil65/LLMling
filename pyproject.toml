#:tombi schema.strict = false

[project]
name = "llmling"
version = "2.2.0"
description = "Declarative YAML-defined resources, prompts and tools for LLM applications and MCP servers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@googlemail.com" },
]
keywords = [
  "ai",
  "configuration",
  "llm",
  "mcp",
  "prompts",
  "pydantic",
  "resources",
  "tools",
  "yaml",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  # Only add below (Copier)
  "anyenv>=2.0.0",
  "docstring-parser>=0.16",
  "epregistry>=1.2.0",
  "fastmcp>=2.13.0",
  "fsspec",
  "httpx2>=2.16",
  "jinja2>=3.1.4",
  "mcp>=1.0.0",
  "packaging>=25.0",
  "platformdirs>=4.3.6",
  "promptantic>=2.0.0",
  "psygnal>=0.11.1",
  "pydantic",
  "rich>=13.0.0",
  "schemez>=1.2.0",
  "typer",
  "universal-pathlib>=0.2.5",
  "upathtools[httpx2]>=1.25.0",
  "yamling>=1.5.0",
]

[project.urls]
"Code coverage" = "https://app.codecov.io/gh/phil65/LLMling"
Documentation = "https://phil65.github.io/LLMling/"
Homepage = "https://github.com/phil65/LLMling"
Issues = "https://github.com/phil65/LLMling/issues"
Source = "https://github.com/phil65/LLMling"

[project.scripts]
llmling = "llmling.__main__:cli"

[project.entry-points.llmling]
tools = "llmling.testing:get_mcp_tools"

[project.optional-dependencies]
agent = ["agentpool"]
all = [
  "agentpool",
  "mcp-server-llmling",
  "watchfiles",
  "pygit2",
  "GitPython",
  "fsspec[http,github]",
]
fsspec_extras = ["fsspec[http,github]"]
git = ["pygit2", "GitPython"]
server = ["mcp-server-llmling"]
watch_files = ["watchfiles"]

[dependency-groups]
dev = [
  "deptry",
  "devtools",
  "openapi-spec-validator>=0.7.1",
  "pyreadline3",
  "pytest",
  # Only add below (Copier)
  "pytest-asyncio>=0.24.0",
  "pytest-cov",
  # "llmling-provider-llm",
]
benchmark = ["pyinstrument"]
docs = [
  "mkdocstrings[python]",
  "mknodes>=4.0.0",
  # Only add below (Copier)
]
lint = [
  # Pinned on purpose: CI, pre-commit and editors all run exactly these versions.
  # Bump them here (template) and roll out via `copier update`.
  "ruff==0.17.6",
  "ty==0.0.110",
  # Only add below (Copier)
]

[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  'if __name__ == "__main__":',
]

[tool.deptry.per_rule_ignores]
# Optional integrations, imported lazily inside the functions that need them.
DEP001 = ["autogen_core", "crewai", "crewai_tools", "langchain_core"]
DEP002 = ["fsspec", "pygit2"]
DEP003 = ["tiktoken"]

[tool.logfire]
ignore_no_config = true
console = false
show_project_link = false

[tool.mknodes]
allowed-commit-types = [
  "fix",
  "feat",
  "refactor",
  "docs",
  "test",
  "build",
  "chore",
]
docstring-style = "google"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
deprecateTypingAliases = true
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownVariableType = false
reportAny = false
reportImplicitOverride = false
reportUnusedFunction = false
reportImplicitStringConcatenation = false
reportIgnoreCommentWithoutRule = false
reportUnannotatedClassAttribute = false
reportSelfClsParameterName = false
reportPrivateImportUsage = false

[tool.pytest]
addopts = ["-m", "not slow"]
filterwarnings = [
  "ignore::DeprecationWarning:litellm.*:",
  "ignore::DeprecationWarning:pydantic.*:",
]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "ERROR"
markers = [
  "asyncio: mark test as async",
  "integration: marks tests as integration tests",
  "slow: marks tests as slow",
  "unit: marks tests as unit tests",
]
minversion = "9.0"
python_files = ["test_*.py"]
pythonpath = ["src"]
testpaths = ["tests/"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",  # Flake8-builtins
  # "ANN",  # Flake8-Annotations
  # "ASYNC",  # Flake8-Async
  # "ARG",  # # Flake8-Unused-Arguments
  "B",  # flake8-bugbear
  "BLE",  # Flake8-blind-except
  "C",
  "C4",  # flake8-comprehensions
  # "C90",  # MCCabe
  "COM",  # Flake8-commas
  # "CPY",  #  Copyright-related rules
  "D",  # PyDocStyle
  # "DTZ",  # Flake8- Datetimez
  "E",  # PyCodeStyle Error
  "EM",  # flake8-errmsg
  # "ERA",  #  Eradicate
  "EXE",  # flake8-executable
  "F",  # PyFlakes
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  "FLY",  # flynt
  "G",  # flake8-logging-format
  "I",  # ISort
  "ICN",  # Flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "N",  # pep8-naming
  # "NPY",  # numpy-specific rules
  # "PD",   # pandas-vet
  "PERF",  # perflint
  # "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # PyLint Error
  "PLC",  # PyLint convention
  # "PLW",  # PyLint Warning
  "PLR",  # PyLint refactor
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  # "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  # "T",
  # "TD",   # flake8-todos
  "T10",  # flake8-debugger
  # "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # PyUpgrade
  "W",  # PyCodeStyle warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",  # Unnecessary {obj_type} call (rewrite as a literal)
  "B905",  # zip() without an explicit strict= parameter
  "C901",  # {name} is too complex ({complexity} > {max_complexity})
  "COM812",
  # "CPY001", # Missing copyright notice at top of file
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in __init__
  "D203",  # 1 blank line required before class docstring
  "D204",  # 1 blank line required after class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D215",  # Section underline is over-indented ("{name}")
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D404",  # First word of the docstring should not be "This"
  "D406",  # Section name should end with a newline ("{name}")
  "D407",  # Missing dashed underline after section ("{name}")
  "D408",  # Section underline should be in the line following the section's name ("{name}")
  "D409",  # Section underline should match the length of its name ("{name}")
  "D413",  # Missing blank line after last section ("{name}")
  "EM101",  # Exception must not use a string literal, assign to variable first
  "EM102",  # Exception must not use an f-string literal, assign to variable first
  "ISC001",
  "PLC0415",
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PLR0917",  # Too many positional arguments
  # "PLR2004", # Magic values instead of named consts
  "SLF001",  # Private member accessed
  "TRY003",  # Avoid specifying long messages outside the exception class
  "TC006",  # runtime-cast-value
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Not needed on Python 3.14 (PEP 649)." }

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "schemez.Schema",
  "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.post",
  "fastmcp.FastMCP.tool",
  "typer.Typer.command",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
# lines-between-types = 1
# atomic = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "I001"]
"scripts/*" = ["INP001"]
"*tests/*" = ["D100"]

[tool.ruff.format]
preview = true

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
# `ty check` (hooks, CI, editors) type-checks the package code only.
include = ["src"]

[tool.ty.analysis]
# Optional dependencies that are not always installed, e.g. "numpy", "numpy.**".
# Unresolved imports are errors otherwise, so broken imports are caught.
allowed-unresolved-imports = [
  "autogen_core",
  "autogen_core.**",
  "crewai.**",
  "crewai_tools",
  "langchain_core.**",
]

[tool.ty.rules]
# Narrowing an overridden class attribute (e.g. pydantic discriminators,
# `Config` attributes) is an intentional pattern.
incompatible-mutable-override = "ignore"

[tool.uv]
default-groups = ["dev", "lint", "docs"]

[tool.uv.build-backend]
wheel-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
source-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
